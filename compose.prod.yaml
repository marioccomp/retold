services:
  database:
    image: pgvector/pgvector:0.8.1-pg18
    env_file:
      - .env
    restart: unless-stopped
    ports:
      # Expõe a porta do banco APENAS para a própria máquina (localhost)
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    deploy:
      resources:
        limits: # IMPORTANTÍSSIMO para a sua VPS de 1GB!
          memory: 256M 
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: retold-redis
    restart: unless-stopped
    ports:
      # Expõe o Redis APENAS para a própria máquina (localhost)
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5



volumes:
  pgdata:
  redisdata:
